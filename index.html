<script>
(function () {
  var FEATURED_COUNT = 4;
  var CANDIDATE_CAP = 24;
  var gridEl = null;
  var renderToken = 0;

  function imageExists(url) {
    return new Promise(function (resolve) {
      if (!url) { resolve(false); return; }
      var img = new Image();
      img.onload = function () { resolve(true); };
      img.onerror = function () { resolve(false); };
      img.src = url;
    });
  }

  function creatorCardHtml(pick) {
    var name = escapeHtml(pick.name || "Creator");
    var href = authorHref({ name: pick.name });
    var avatarUrl = pick.avatarUrl || PLACEHOLDER_AVATAR;
    return (
      '<a class="featured-creator-card" href="' + href + '">' +
        '<img class="featured-creator-avatar" src="' + escapeHtml(avatarUrl) + '" alt="' + name + '" ' +
             'loading="lazy" width="88" height="88" ' +
             'onerror="this.onerror=null;this.src=\'' + PLACEHOLDER_AVATAR + '\';">' +
        '<span class="featured-creator-name">' + name + '</span>' +
      '</a>'
    );
  }

  async function pickFeaturedAuthors(count) {
    var videos = await fetchAllVideos();
    var seen = new Set();
    var names = [];
    videos.forEach(function (v) {
      var key = normalizeName(v.author);
      if (!key || seen.has(key)) return;
      seen.add(key);
      names.push(v.author);
    });
    names = shuffleArray(names);

    var candidates = names.slice(0, Math.min(CANDIDATE_CAP, names.length));
    var checked = await Promise.all(candidates.map(function (name) {
      var url = authorImageUrl(name);
      return imageExists(url).then(function (ok) {
        return { name: name, avatarUrl: url, ok: ok };
      });
    }));

    var picks = checked.filter(function (r) { return r.ok; }).slice(0, count);

    if (picks.length < count) {
      var usedKeys = new Set(picks.map(function (p) { return normalizeName(p.name); }));
      for (var i = 0; i < names.length && picks.length < count; i++) {
        var key = normalizeName(names[i]);
        if (usedKeys.has(key)) continue;
        usedKeys.add(key);
        picks.push({ name: names[i], avatarUrl: PLACEHOLDER_AVATAR });
      }
    }
    return picks;
  }

  async function renderFeaturedCreators() {
    if (!gridEl) return;
    var myToken = ++renderToken;
    try {
      var picks = await pickFeaturedAuthors(FEATURED_COUNT);
      if (myToken !== renderToken) return;
      if (!picks.length) {
        gridEl.innerHTML = "";
        return;
      }
      gridEl.innerHTML = picks.map(creatorCardHtml).join("");
    } catch (err) {
      console.error("[featured-creators] failed to load authors:", err);
      if (myToken === renderToken) gridEl.innerHTML = "";
    }
  }

  function init() {
    gridEl = document.getElementById("featuredCreatorsGrid");
    if (!gridEl) return;

    renderFeaturedCreators();

    var authWidget = document.getElementById("authWidget");
    if (authWidget && "MutationObserver" in window) {
      var lastHtml = authWidget.innerHTML;
      var mo = new MutationObserver(function () {
        if (authWidget.innerHTML === lastHtml) return;
        lastHtml = authWidget.innerHTML;
        renderFeaturedCreators();
      });
      mo.observe(authWidget, { childList: true, subtree: true });
    }

    window.addEventListener("streamhub:authchange", renderFeaturedCreators);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
