<!-- ============ Xstream mini loader — small inline spinner reused
     wherever the page shows an in-context loading state (infinite
     scroll "loading more"). The old .brand-logo-img rule that used
     to sit in this block is gone — logo sizing is inline on the
     <img> inside /partials/header.html now, so it doesn't need to
     be redefined per page. ============ -->
<style>
  .xs-loader {
    --xs-green: #53FC18;
    --xs-dark: #0E0E10;
    position: relative;
    width: 28px;
    height: 28px;
    display: inline-block;
    vertical-align: -8px;
  }
  .xs-loader__ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(var(--xs-green) 0deg, transparent 300deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    animation: xs-spin 0.9s linear infinite;
  }
  .xs-loader__mark {
    position: absolute;
    inset: 6px;
    border-radius: 22%;
    background: var(--xs-green);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: xs-pulse 1.8s ease-in-out infinite;
  }
  .xs-loader__mark svg { width: 62%; height: 62%; display: block; }

  @keyframes xs-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes xs-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(0.92); }
  }

  @media (prefers-reduced-motion: reduce) {
    .xs-loader__ring { animation: none; }
    .xs-loader__mark { animation: none; }
  }

  /* ---- Search top meta: author-match card + related tags ---- */
  .search-top-meta {
    display: none;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 18px;
  }
  .search-author-card {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 360px;
    padding: 12px 16px;
    background: #18181b;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    text-decoration: none;
    color: #f1f1f1;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .search-author-card:hover {
    border-color: rgba(83,252,24,0.5);
    background: #1e1e22;
  }
  .search-author-card img {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    flex: 0 0 auto;
    background: #3a3a3a;
  }
  .sac-text { min-width: 0; }
  .sac-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #8a8a92;
  }
  .sac-name {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .search-tags-wrap { display: none; }
  .search-tags-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .search-tags-toggle {
    display: none;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    padding: 0;
    background: none;
    border: none;
    color: #8a8a92;
    font-size: 12.5px;
    cursor: pointer;
  }
  .search-tags-toggle:hover { color: #f1f1f1; }
  .search-tags-chevron { transition: transform 0.2s ease; }
  .search-tags-wrap.collapsed .search-tags-chevron { transform: rotate(-90deg); }
</style>

<script>
(function () {
  var runWhenIdle = window.requestIdleCallback || function (cb) { setTimeout(cb, 1); };
  runWhenIdle(function () {
  var slots = [
    ["adSlot1", "banner160x300"],
    ["adSlot3", "banner160x600"],
    ["sidebarNativeAdSlot", "nativeBanner"]
  ];
  slots.forEach(function (pair) {
    var id = pair[0], key = pair[1];
    var el = document.getElementById(id);
    if (!el) return;
    if (typeof fillAdSlot !== "function") {
      el.textContent = "Error: config.js not loaded (fillAdSlot missing)";
      el.style.color = "#ff6b6b";
      console.error("[ads] fillAdSlot is not defined — check config.js is returning 200, not 404, in DevTools > Network.");
      return;
    }
    if (typeof AD_CODES === "undefined" || !AD_CODES[key] || !AD_CODES[key].trim()) {
      el.textContent = 'Error: no AD_CODES entry for "' + key + '"';
      el.style.color = "#ff6b6b";
      console.error('[ads] AD_CODES["' + key + '"] is empty in config.js.');
      return;
    }
    var ok = fillAdSlot(el, key);
    if (!ok) {
      el.textContent = 'Error: fillAdSlot() failed for "' + key + '"';
      el.style.color = "#ff6b6b";
    }
  });
  if (typeof injectPageLevelAds === "function") injectPageLevelAds();
  });
})();
</script>

<!-- Featured creators — page-specific content, not header/footer,
     so it stays here rather than moving into header-footer-init.js. -->
<script>
(function () {
  var FEATURED_COUNT = 4;
  var CANDIDATE_CAP = 24;
  var gridEl = null;
  var renderToken = 0;

  function imageExists(url) {
    return new Promise(function (resolve) {
      if (!url) { resolve(false); return; }
      var img = new Image();
      img.onload = function () { resolve(true); };
      img.onerror = function () { resolve(false); };
      img.src = url;
    });
  }

  function creatorCardHtml(pick) {
    var name = escapeHtml(pick.name || "Creator");
    var href = authorHref({ name: pick.name });
    var avatarUrl = pick.avatarUrl || PLACEHOLDER_AVATAR;
    return (
      '<a class="featured-creator-card" href="' + href + '">' +
        '<img class="featured-creator-avatar" src="' + escapeHtml(avatarUrl) + '" alt="' + name + '" ' +
             'loading="lazy" width="88" height="88" ' +
             'onerror="this.onerror=null;this.src=\'' + PLACEHOLDER_AVATAR + '\';">' +
        '<span class="featured-creator-name">' + name + '</span>' +
      '</a>'
    );
  }

  async function pickFeaturedAuthors(count) {
    var videos = await fetchAllVideos();
    var seen = new Set();
    var names = [];
    videos.forEach(function (v) {
      var key = normalizeName(v.author);
      if (!key || seen.has(key)) return;
      seen.add(key);
      names.push(v.author);
    });
    names = shuffleArray(names);

    var candidates = names.slice(0, Math.min(CANDIDATE_CAP, names.length));
    var checked = await Promise.all(candidates.map(function (name) {
      var url = authorImageUrl(name);
      return imageExists(url).then(function (ok) {
        return { name: name, avatarUrl: url, ok: ok };
      });
    }));

    var picks = checked.filter(function (r) { return r.ok; }).slice(0, count);

    if (picks.length < count) {
      var usedKeys = new Set(picks.map(function (p) { return normalizeName(p.name); }));
      for (var i = 0; i < names.length && picks.length < count; i++) {
        var key = normalizeName(names[i]);
        if (usedKeys.has(key)) continue;
        usedKeys.add(key);
        picks.push({ name: names[i], avatarUrl: PLACEHOLDER_AVATAR });
      }
    }
    return picks;
  }

  async function renderFeaturedCreators() {
    if (!gridEl) return;
    var myToken = ++renderToken;
    try {
      var picks = await pickFeaturedAuthors(FEATURED_COUNT);
      if (myToken !== renderToken) return;
      if (!picks.length) {
        gridEl.innerHTML = "";
        return;
      }
      gridEl.innerHTML = picks.map(creatorCardHtml).join("");
    } catch (err) {
      console.error("[featured-creators] failed to load authors:", err);
      if (myToken === renderToken) gridEl.innerHTML = "";
    }
  }

  function init() {
    gridEl = document.getElementById("featuredCreatorsGrid");
    if (!gridEl) return;

    renderFeaturedCreators();

    var authWidget = document.getElementById("authWidget");
    if (authWidget && "MutationObserver" in window) {
      var lastHtml = authWidget.innerHTML;
      var mo = new MutationObserver(function () {
        if (authWidget.innerHTML === lastHtml) return;
        lastHtml = authWidget.innerHTML;
        renderFeaturedCreators();
      });
      mo.observe(authWidget, { childList: true, subtree: true });
    }

    window.addEventListener("streamhub:authchange", renderFeaturedCreators);
  }

  // authWidget doesn't exist until the header partial loads, so wait
  // for that instead of DOMContentLoaded.
  document.addEventListener("partials:loaded", init);
})();
</script>
