<!-- Xstream mini loader — same small spinner used elsewhere, reused
     here for the player's loading state while the direct video URL /
     views are resolved. (The old .brand-logo-img rule that used to
     live in this block is gone — the header/footer partials size
     their own logo inline now, see /partials/header.html, so it no
     longer needs to exist per-page.) -->
<style>
  .xs-loader {
    --xs-green: #53FC18;
    --xs-dark: #0E0E10;
    position: relative;
    width: 40px;
    height: 40px;
    display: inline-block;
    vertical-align: -12px;
  }
  .xs-loader__ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(var(--xs-green) 0deg, transparent 300deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
    animation: xs-spin 0.9s linear infinite;
  }
  .xs-loader__mark {
    position: absolute;
    inset: 8px;
    border-radius: 22%;
    background: var(--xs-green);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: xs-pulse 1.8s ease-in-out infinite;
  }
  .xs-loader__mark svg { width: 62%; height: 62%; display: block; }

  @keyframes xs-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes xs-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(0.92); }
  }

  @media (prefers-reduced-motion: reduce) {
    .xs-loader__ring { animation: none; }
    .xs-loader__mark { animation: none; }
  }

  .xs-caption { color:#8a8a8f; font-size:13px; letter-spacing:0.02em; }

  .player-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    height: 100%;
    min-height: 240px;
  }
</style>

<!-- 3. Fill this page's OWN ad slots (right column + inline) — these
        aren't part of the header/footer partials so header-footer-init.js
        doesn't touch them. Deferred to idle time so ad iframes never
        compete with the player/related grid for bandwidth. -->
<script>
(function () {
  var runWhenIdle = window.requestIdleCallback || function (cb) { setTimeout(cb, 1); };
  runWhenIdle(function () {
  var slots = [
    ["adSlot1", "banner160x300"],
    ["adSlot3", "banner160x600"],
    ["adSlotInline", "banner728x90"]
  ];
  slots.forEach(function (pair) {
    var id = pair[0], key = pair[1];
    var el = document.getElementById(id);
    if (!el) return;
    if (typeof fillAdSlot !== "function") {
      el.textContent = "Error: config.js not loaded (fillAdSlot missing)";
      el.style.color = "#ff6b6b";
      console.error("[ads] fillAdSlot is not defined — check config.js is returning 200, not 404, in DevTools > Network.");
      return;
    }
    if (typeof AD_CODES === "undefined" || !AD_CODES[key] || !AD_CODES[key].trim()) {
      el.textContent = 'Error: no AD_CODES entry for "' + key + '"';
      el.style.color = "#ff6b6b";
      console.error('[ads] AD_CODES["' + key + '"] is empty in config.js.');
      return;
    }
    var ok = fillAdSlot(el, key);
    if (!ok) {
      el.textContent = 'Error: fillAdSlot() failed for "' + key + '"';
      el.style.color = "#ff6b6b";
    }
  });
  if (typeof injectPageLevelAds === "function") injectPageLevelAds();
  });
})();
</script>

<!-- 4. Watch-page logic: finds the video matching the /watch/<slug>
        path, renders player, title, tags, author, related videos +
        in-page search.

     FIX (this revision): the physical files for this template now
     live in a NESTED folder — v/watch/index.html (this file) and
     v/watch/watch.js — because the /_redirects rule rewrites the
     clean /watch/:slug URL to the DIRECTORY /v/watch/, and Cloudflare
     Pages serves that directory's index.html automatically:

         /watch/:slug   /v/watch/   200

     The previous src here was "/v/watch.js" — a leftover from when
     this template was a single flat file at /v/watch.html. That path
     no longer exists on disk (this file itself proves it: it's at
     v/watch/index.html now, one folder deeper), so the browser was
     requesting a file that was never there. Root-absolute is still
     correct and still required (a relative "watch.js" would resolve
     against the fake /watch/<slug> address-bar path, not this file's
     real location) — it just needs to point at the CURRENT real
     location: /v/watch/watch.js. -->
<script src="/v/watch/watch.js"></script>
